# /etc/asound.conf (S10): the default sound device is the loopback that feeds CamillaDSP.
# Programs that just play to "default" land here. For best quality, players should open
# hw:Loopback,0,0 directly with the format CamillaDSP captures (see /etc/camilladsp/README).
pcm.!default {
	type plug
	slave.pcm "hw:Loopback,0,0"
}
ctl.!default {
	type hw
	card Loopback
}

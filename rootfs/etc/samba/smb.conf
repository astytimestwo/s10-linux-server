# S10 Samba: browse the phone's files from Windows Explorer.
#   \\<s10-tailscale-ip>\srv   (Tailscale, any network)   or   \\<s10-lan-ip>\srv   (home Wi-Fi)
# Login: user "user" with the Samba password set by `smbpasswd -a user` (separate from the Linux password).
# The firewall only lets SMB in from the home LAN and Tailscale.
[global]
	workgroup = WORKGROUP
	server string = S10
	server role = standalone server
	security = user
	map to guest = never
	server min protocol = SMB2_10
	disable netbios = yes
	smb ports = 445
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	log file = /var/log/samba/%m.log
	max log size = 1000
	# Windows-friendly: keep Unix permissions sane for files created from Explorer
	create mask = 0664
	directory mask = 0775
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream

# The big 107 GB drive (projects in /srv/code, files in /srv/files)
[srv]
	path = /srv
	valid users = user
	read only = no
	force user = user

# The user's home folder on the phone (Claude Code configs, dotfiles)
[home]
	path = /home/user
	valid users = user
	read only = no
	force user = user
	# keep SSH keys out of reach of the file share
	veto files = /.ssh/

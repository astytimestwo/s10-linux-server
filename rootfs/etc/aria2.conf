# S10 aria2 download station -> /etc/aria2.conf (root:user 640, holds the RPC secret)
# Service: /etc/init.d/aria2 (Alpine aria2-daemon), runs as "user" via /etc/conf.d/aria2.
# Web UI (AriaNg): http://<s10-tailscale-ip>:6880  (Tailscale only; the firewall blocks 6800/6880 from the LAN)
# Keep a copy of the RPC secret somewhere private on your PC (you paste it into AriaNg once).

# Where files go (shows up in the Explorer share as \srv\files\downloads)
dir=/srv/files/downloads

# Remember the queue across restarts/reboots
save-session=/var/lib/aria2/aria2.session
input-file=/var/lib/aria2/aria2.session
save-session-interval=60

# Resume when the server allows it; if it doesn't, start over instead of failing
continue=true
always-resume=false
max-tries=20
retry-wait=15
connect-timeout=30
timeout=60

# Speed: several connections per file (only helps on servers that allow ranges).
# 4, not 8: some servers answer 429 "too many requests" to more (seen with proof.ovh.net)
max-concurrent-downloads=3
max-connection-per-server=4
split=4
min-split-size=4M
file-allocation=falloc
disk-cache=32M
content-disposition-default-utf8=true

# Remote control (AriaNg talks to this)
rpc-listen-all=true
rpc-listen-port=6800
rpc-allow-origin-all=true
rpc-secret=RPC_SECRET_PLACEHOLDER

# Torrents: no inbound ports are open, so download-only; stop seeding when done
seed-time=0
dht-file-path=/var/lib/aria2/dht.dat
dht-file-path6=/var/lib/aria2/dht6.dat

log=/var/log/aria2.log
log-level=notice
summary-interval=0

# S10 tmux config (~/.tmux.conf). Start or re-attach with:  t
set -g mouse on                    # scroll and click panes with the mouse
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -sg escape-time 10             # snappy Esc (vim, Claude Code)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on
# Status bar: session name left, temperatures + battery + clock right (refresh 15 s)
set -g status-interval 15
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=colour114,bold] #S #[default] "
set -g status-left-length 20
set -g status-right "#[fg=colour180]#(/usr/local/bin/s10-status -t)#[default]  %H:%M "
set -g status-right-length 50
setw -g window-status-current-style "fg=colour231,bold"
# Split panes keeping the current folder:  Ctrl-b |  and  Ctrl-b -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
